<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1B5E20">
<title>Nutsa · Confirmation</title>
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<!-- ================== SPLASH ================== -->
<section id="splash-screen" class="screen active">
  <div class="splash">
    <div class="brand-logo">🌰</div>
    <h1 class="splash-title">Nutsa</h1>
    <div class="splash-spinner"></div>
  </div>
</section>

<!-- ================== DASHBOARD ================== -->
<section id="dashboard-screen" class="screen">
  <header class="app-header">
    <div class="header-inner">
      <div class="header-left">
        <div class="agent-badge" id="agent-badge">A1</div>
        <div>
          <p class="header-title">Nutsa <span class="pill" id="total-pill">0</span></p>
          <p class="header-sub" id="header-date"></p>
        </div>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat" data-jump="Pending">
        <div class="stat-num" id="stat-pending">0</div>
        <div class="stat-label">Attente</div>
      </div>
      <div class="stat stat-purple" data-jump="Callback">
        <div class="stat-num" id="stat-callback">0</div>
        <div class="stat-label">Rappel</div>
      </div>
      <div class="stat stat-orange" data-jump="No Answer">
        <div class="stat-num" id="stat-noans">0</div>
        <div class="stat-label">Sans rép.</div>
      </div>
      <div class="stat stat-green" data-jump="Confirmed">
        <div class="stat-num" id="stat-confirmed">0</div>
        <div class="stat-label">Confirmées</div>
      </div>
      <div class="stat stat-livred" data-jump="Livré">
        <div class="stat-num" id="stat-livre">0</div>
        <div class="stat-label">Livrées</div>
      </div>
      <div class="stat stat-red" data-jump="Cancelled">
        <div class="stat-num" id="stat-cancelled">0</div>
        <div class="stat-label">Annulées</div>
      </div>
    </div>
  </header>

  <div class="filter-bar">
    <button class="chip chip-active" data-filter="all">Toutes</button>
    <button class="chip" data-filter="Pending">En attente</button>
    <button class="chip" data-filter="Callback">Rappeler</button>
    <button class="chip" data-filter="No Answer">Sans réponse</button>
    <button class="chip" data-filter="Confirmed">Confirmées</button>
    <button class="chip" data-filter="Livré">Livrées</button>
    <button class="chip" data-filter="Cancelled">Annulées</button>
    <button class="chip" data-filter="Split">Split</button>
  </div>

  <div class="search-bar">
    <input type="search" id="search-input" placeholder="🔍 Nom, téléphone, N° commande, commune, tracking…">
  </div>

  <main id="orders-list" class="orders-list">
    <div class="loading">Chargement…</div>
  </main>

  <button id="refresh-btn" class="fab" title="Actualiser">↻</button>
</section>

<!-- ================== ORDER DETAIL SHEET ================== -->
<section id="order-sheet" class="sheet-overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <button class="sheet-close" id="sheet-close">✕</button>

    <div class="sheet-body" id="sheet-body">
      <!-- filled dynamically -->
    </div>
  </div>
</section>

<!-- ================== TOAST ================== -->
<div id="toast" class="toast"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
